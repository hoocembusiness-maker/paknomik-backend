{% extends "base.html" %}
<!-- -->
{% block title %}Paknomik - Home{% endblock %}
<!-- -->
{%block content %}
<h1 class="hero">All PACKAGINGS, One PLACE.</h1>

<!-- Button row -->
<div
  class="row container-fluid"
  style="margin-left: 15%; margin-right: 15%; margin-top: 2%"
>
  <div class="col-md-6 btn_home_parent">
    <button type="button" class="btn font_1 btn_home primary">
      Packaging Supplier
    </button>
  </div>
  <div class="col-md-6 btn_home_parent">
    <button type="button" class="btn font_1 btn_home secondary">
      Packaging Customer
    </button>
  </div>
</div>

<!-- Carousel section -->
<div
  class="row container-fluid"
  style="margin-left: 15%; margin-right: 15%; margin-top: 2%"
>
  <p class="hero" style="font-size: 1.2vw; font-weight: 500; display: block">
    Explore the Packaging Market with PRAGMADINARMIK
  </p>

  <!-- Bootstrap 3 Carousel -->
  <div
    id="myCarousel"
    class="carousel slide text-center"
    data-ride="carousel"
    style="height: 25vw"
  >
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#myCarousel" data-slide-to="1"></li>
      <li data-target="#myCarousel" data-slide-to="2"></li>
      <li data-target="#myCarousel" data-slide-to="3"></li>
      <li data-target="#myCarousel" data-slide-to="4"></li>
      <li data-target="#myCarousel" data-slide-to="5"></li>
      <li data-target="#myCarousel" data-slide-to="6"></li>
    </ol>

    <!-- Wrapper for slides -->
    <div class="carousel-inner">
      <div class="item container text-center active">
        <img src="/static/images/p1.png" alt="boxes" style="height: 100%" />
      </div>
      <div class="item">
        <img src="/static/images/p2.png" alt="flexible" style="height: 100%" />
      </div>
      <div class="item">
        <img src="/static/images/p3.png" alt="flexible" style="height: 100%" />
      </div>
      <div class="item">
        <img src="/static/images/p4.png" alt="flexible" style="height: 100%" />
      </div>
      <div class="item">
        <img src="/static/images/p.png" alt="flexible" style="height: 100%" />
      </div>
      <div class="item">
        <img src="/static/images/p6.png" alt="flexible" style="height: 100%" />
      </div>
      <div class="item">
        <img src="/static/images/p7.png" alt="flexible" style="height: 100%" />
      </div>
    </div>

    <!-- Left and right controls -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
</div>
{% endblock %}
